<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Non-convergent capture viewport</title>
    <style>
      html,
      body {
        margin: 0;
      }

      .viewport-relative {
        height: 100vh;
        background: #fff;
      }

      .fixed-tail {
        height: 500px;
        background: #000;
      }
    </style>
  </head>
  <body>
    <main class="viewport-relative">Viewport-relative content</main>
    <footer class="fixed-tail">Fixed tail</footer>
  </body>
</html>
