<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Rendered layout checks</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 24px; font: 16px/20px system-ui, sans-serif; }
      section { margin: 24px 0; }
      .row { display: flex; align-items: center; width: max-content; }
      .row > * { display: inline-flex; align-items: center; }
      .icon { width: 16px; height: 16px; }
      .bad-align .icon { transform: translateY(-6px); }
      .good-gap { gap: 10px; }
      .bad-gap { gap: 10px; }
      .bad-gap > :last-child { margin-left: 10px; }
      .gap-box { width: 20px; height: 20px; background: #ddd; }
      .clip-good, .clip-bad { width: 100px; height: 30px; overflow: hidden; }
      .clip-good > div { width: 100px; height: 30px; }
      .clip-bad > div { width: 120px; height: 30px; }
      .clip-text-case { width: 100px; }
      .clip-text-case.clip-text-bad { width: 60px; }
      .clip-text-case .text-host { width: 100%; }
      .clip-text-scroll { width: 60px; overflow-x: auto; }
      /* Radius uses its rectangular padding box with visible or hidden overflow. */
      .clip-rounded-visible { width: 100px; border-radius: 12px; }
      .clip-rounded-hidden { width: 100px; border-radius: 12px; overflow: hidden; }
      .clip-path-unknown { width: 100px; clip-path: circle(50%); }
      .overlap-good { display: flex; gap: 4px; }
      .overlap-bad { display: grid; width: 40px; height: 24px; }
      .overlap-bad > * { grid-area: 1 / 1; width: 30px; height: 20px; }
      .overlap-box { width: 20px; height: 20px; background: #bbb; }
      .hit-good button { width: 28px; height: 28px; padding: 0; }
      .hit-bad { display: flex; gap: 0; }
      .hit-bad button { width: 12px; height: 12px; min-width: 0; padding: 0; }
      .panel { border: 1px solid #999; background: #eee; height: 20px; }
      .crowd-good .panel + .panel { margin-top: 16px; }
      .crowd-bad .panel + .panel { margin-top: 0; }
      .crowd-plain p { margin: 0; }
      /* Composite: wrapper-of-panels is not itself a panel. */
      .crowd-composite-bad .group,
      .crowd-composite-good .group,
      .crowd-composite-deep .group { display: block; }
      .crowd-composite-bad > .panel { margin-top: 0; }
      .crowd-composite-good > .panel { margin-top: 16px; }
      .crowd-composite-deep .group p { margin: 0; height: 40px; }
      .crowd-composite-deep > .panel { margin-top: 0; }
    </style>
  </head>
  <body>
    <section class="row align-good">
      <a href="#good"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><rect width="16" height="16" /></svg></a>
      <span>Aligned text</span>
    </section>
    <section class="row bad-align">
      <a href="#bad"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><rect width="16" height="16" /></svg></a>
      <span>Reference text</span>
    </section>
    <section class="row good-gap">
      <div class="gap-box"></div><div class="gap-box"></div><div class="gap-box"></div>
    </section>
    <section class="row bad-gap">
      <div class="gap-box"></div><div class="gap-box"></div><div class="gap-box"></div>
    </section>
    <section class="row two-gap">
      <div class="gap-box"></div><div class="gap-box"></div>
    </section>
    <section class="clip-good"><div></div></section>
    <section class="clip-bad"><div></div></section>
    <section class="clip-text-case"><div class="text-host">Fits</div></section>
    <section class="clip-text-case clip-text-bad"><div class="text-host">Persistence</div></section>
    <section class="clip-text-scroll">Persistence</section>
    <section class="clip-rounded-visible"><div>Visible rounded container</div></section>
    <section class="clip-rounded-hidden"><div>Hidden rounded container</div></section>
    <section class="clip-path-unknown"><div>Non-rectangular clip path</div></section>
    <section class="overlap-good">
      <div class="overlap-box"></div><div class="overlap-box"></div>
    </section>
    <section class="overlap-bad">
      <button type="button">A</button><button type="button">B</button>
    </section>
    <section class="hit-good"><button type="button" aria-label="Good target"></button></section>
    <section class="hit-bad">
      <button type="button" aria-label="Small target one"></button>
      <button type="button" aria-label="Small target two"></button>
    </section>
    <section class="crowd-good">
      <div class="panel"></div><div class="panel"></div>
    </section>
    <section class="crowd-bad">
      <div class="panel"></div><div class="panel"></div>
    </section>
    <section class="crowd-plain">
      <p>Plain block one, no border or background.</p>
      <p>Plain block two, flush against the first but not a panel.</p>
    </section>
    <section class="crowd-composite-bad">
      <div class="group"><div class="panel"></div></div>
      <div class="panel"></div>
    </section>
    <section class="crowd-composite-good">
      <div class="group"><div class="panel"></div></div>
      <div class="panel"></div>
    </section>
    <section class="crowd-composite-deep">
      <div class="group">
        <div class="panel"></div>
        <p>Prose keeps the inner panel away from the next sibling.</p>
      </div>
      <div class="panel"></div>
    </section>
  </body>
</html>
