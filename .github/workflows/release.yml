name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pull-requests: write
  id-token: write   # npm trusted publishing: the OIDC token is the only publish credential

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    name: Publish via changesets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      # Trusted publishing needs npm 11.5.1 or later, which Node 24 ships. npm exchanges this job's
      # OIDC token for a short-lived publish token on its own; no npm token exists anywhere.
      - name: Setup Node (for npm publish)
        uses: actions/setup-node@v6
        with:
          node-version: "24.21"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # A merged metadata PR can leave no push-triggered run. Manual replay
      # uses this same path, but neither entry point may publish an untested,
      # stale, or non-main snapshot. CI includes the packed Node and installer
      # smoke jobs as well as the complete test suite.
      - name: Require successful CI for the current main commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "Release requires the main branch." >&2
            exit 1
          fi
          for attempt in $(seq 1 80); do
            current_main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
            if [ "$current_main" != "$GITHUB_SHA" ]; then
              echo "Release snapshot is no longer the current main commit." >&2
              exit 1
            fi
            ci_state=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
              -f head_sha="$GITHUB_SHA" -f branch=main -f event=push -f per_page=20 \
              --jq '.workflow_runs | map(select(.head_sha == env.GITHUB_SHA and .head_branch == "main" and .event == "push")) | sort_by(.run_number) | last | if . == null then "missing" else .status + ":" + (.conclusion // "") end')
            case "$ci_state" in
              completed:success) break ;;
              completed:*) echo "Release refused: CI finished as $ci_state." >&2; exit 1 ;;
            esac
            if [ "$attempt" -eq 80 ]; then
              echo "Release refused: successful CI was not available. Retry this workflow after CI passes." >&2
              exit 1
            fi
            echo "Waiting for CI on $GITHUB_SHA ($ci_state)."
            sleep 15
          done

      # Opens or updates the release PR while changesets are pending. Publishing is its own step
      # below, so npm itself handles the trusted-publishing exchange rather than the action.
      - name: Create or update the release PR
        id: changesets
        uses: changesets/action@v1
        with:
          version: bun x changeset version
          commit: "chore(release): version bump + changelog"
          title: "chore(release): version bump + changelog"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # With no changesets pending, main holds a released version. Publish it if npm does not have it
      # yet; a push that changed nothing publishable does nothing.
      - name: Publish an unpublished version
        id: publish
        if: ${{ steps.changesets.outputs.hasChangesets == 'false' }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          if npm view "harnery@$version" version --prefer-online >/dev/null 2>&1; then
            echo "harnery@$version is already on npm; nothing to publish."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npm --version
          bun x changeset publish
          git push origin --tags
          echo "published=true" >> "$GITHUB_OUTPUT"

      # `changeset publish` reports success whenever `npm publish` exits 0, and it prints nothing of
      # npm's own output on success. A publish once reported success for a version the registry
      # never served, so the published version is checked against the registry itself, and npm's
      # debug logs are kept either way. npm can take several minutes to serve a new version (about
      # seven for 0.41.0), so the check waits up to 15.
      - name: Verify the published version is on the registry
        if: ${{ steps.publish.outputs.published == 'true' }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          for attempt in $(seq 1 60); do
            if npm view "harnery@$version" version --prefer-online >/dev/null 2>&1; then
              echo "harnery@$version is on the registry."
              exit 0
            fi
            echo "harnery@$version is not on the registry yet (check $attempt of 60)."
            sleep 15
          done
          echo "Publish reported success, but harnery@$version is not on the registry after 15 minutes." >&2
          exit 1

      - name: Keep npm's debug logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: npm-logs
          path: ~/.npm/_logs/
          if-no-files-found: ignore
          retention-days: 14
