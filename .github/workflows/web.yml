name: Web

on:
  push:
    branches: [main, next]
    paths:
      - "web/**"
      - "scripts/check-local.mjs"
      - "package.json"
      - ".github/workflows/web.yml"
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - "scripts/check-local.mjs"
      - "package.json"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test + build dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install root dependencies
        working-directory: .
        run: bun install --frozen-lockfile

      - name: Dashboard dependencies, tests, and production build
        working-directory: .
        run: bun run check:local web
